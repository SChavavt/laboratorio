name: Codex validation

on:
  push:
    branches:
      - codex/mejora-filtros-columnas-laboratorio

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_workbench.py tests/test_alineadores_pg.py
